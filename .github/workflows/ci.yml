name: CI TecnoStock
on: [push, pull_request]
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check src tests
      - name: Pruebas y cobertura minima 80%
        run: pytest -v --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=80
      - name: Escenarios E01-E15
        run: python ejecutar_escenarios.py
      - name: Compilar
        run: python -m compileall -q src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-html
          path: htmlcov
